; /etc/php/8.4/fpm/pool.d/trokly.conf
; Pool PHP-FPM dédié à Trokly API

[trokly]
user  = www-data
group = www-data

; Socket Unix (plus rapide qu'un port TCP)
listen = /run/php/php8.4-fpm-trokly.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Processus
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests      = 500

; Logs
access.log           = /var/log/php8.4-fpm-trokly-access.log
slowlog              = /var/log/php8.4-fpm-trokly-slow.log
request_slowlog_timeout = 10s

; Variables d'environnement (Laravel les lit depuis le .env, pas besoin de tout mettre ici)
env[PATH] = /usr/local/bin:/usr/bin:/bin
