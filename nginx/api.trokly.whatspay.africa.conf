# ── api.trokly.whatspay.africa — Laravel (PHP-FPM) ────────────
server {
    listen 80;
    server_name api.trokly.whatspay.africa;

    root /var/www/trokly/trokly-api/public;
    index index.php;

    # Redirect HTTP → HTTPS (décommente après certbot)
    # return 301 https://$host$request_uri;

    # Taille max upload (photos Cloudinary via API)
    client_max_body_size 20M;

    # CORS headers (Next.js → API)
    add_header Access-Control-Allow-Origin  "https://trokly.whatspay.africa" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.3-fpm-trokly.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
